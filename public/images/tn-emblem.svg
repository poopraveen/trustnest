<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle - dark green border -->
  <circle cx="100" cy="100" r="97" fill="#1a5c1a" stroke="#0d3b0d" stroke-width="2"/>
  <circle cx="100" cy="100" r="90" fill="#ffffff" stroke="#1a5c1a" stroke-width="1.5"/>

  <!-- Inner green ring text area -->
  <circle cx="100" cy="100" r="88" fill="#f0f8f0" stroke="#1a5c1a" stroke-width="1"/>

  <!-- Gopuram (temple tower) - simplified -->
  <!-- Base platform -->
  <rect x="62" y="130" width="76" height="10" fill="#c8a020" rx="1"/>
  <rect x="66" y="125" width="68" height="7" fill="#d4aa22" rx="1"/>

  <!-- Temple tiers (gopuram) -->
  <rect x="70" y="115" width="60" height="11" fill="#d4aa22" rx="1"/>
  <rect x="74" y="106" width="52" height="10" fill="#c8a020" rx="1"/>
  <rect x="78" y="97" width="44" height="10" fill="#d4aa22" rx="1"/>
  <rect x="82" y="89" width="36" height="9" fill="#c8a020" rx="1"/>
  <rect x="86" y="82" width="28" height="8" fill="#d4aa22" rx="1"/>
  <rect x="89" y="76" width="22" height="7" fill="#c8a020" rx="1"/>
  <rect x="92" y="71" width="16" height="6" fill="#d4aa22" rx="1"/>
  <rect x="94" y="67" width="12" height="5" fill="#c8a020" rx="1"/>
  <!-- Kalasam (finial) -->
  <ellipse cx="100" cy="63" rx="5" ry="5" fill="#c8a020"/>
  <rect x="99" y="55" width="2" height="9" fill="#c8a020"/>
  <ellipse cx="100" cy="54" rx="3" ry="3" fill="#d4aa22"/>

  <!-- Decorative details on gopuram tiers -->
  <line x1="75" y1="119" x2="75" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="80" y1="119" x2="80" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="85" y1="119" x2="85" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="90" y1="119" x2="90" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="95" y1="119" x2="95" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="100" y1="119" x2="100" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="105" y1="119" x2="105" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="110" y1="119" x2="110" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="115" y1="119" x2="115" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="120" y1="119" x2="120" y2="125" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="125" y1="119" x2="125" y2="125" stroke="#8B6914" stroke-width="0.8"/>

  <!-- Ashoka Pillar / Lion capital (base of temple) -->
  <rect x="88" y="139" width="24" height="4" fill="#c8821a" rx="1"/>
  <!-- Three lions simplified -->
  <ellipse cx="94" cy="136" rx="5" ry="5" fill="#c8821a"/>
  <ellipse cx="100" cy="134" rx="5" ry="5" fill="#c8821a"/>
  <ellipse cx="106" cy="136" rx="5" ry="5" fill="#c8821a"/>
  <!-- Lion heads -->
  <circle cx="94" cy="133" r="3" fill="#d4961c"/>
  <circle cx="100" cy="131" r="3" fill="#d4961c"/>
  <circle cx="106" cy="133" r="3" fill="#d4961c"/>

  <!-- Tricolour flag strip -->
  <rect x="70" y="143" width="60" height="4" fill="#FF9933"/>
  <rect x="70" y="147" width="60" height="4" fill="#ffffff"/>
  <rect x="70" y="151" width="60" height="4" fill="#138808"/>
  <!-- Ashoka Chakra -->
  <circle cx="100" cy="149" r="4" fill="none" stroke="#000080" stroke-width="0.8"/>
  <circle cx="100" cy="149" r="0.8" fill="#000080"/>

  <!-- Curved text at bottom: TRUTH ALONE TRIUMPHS -->
  <path id="bottomArc" d="M 22,120 A 78,78 0 0,0 178,120" fill="none"/>
  <text font-size="9" font-family="Arial, sans-serif" font-weight="bold" fill="#1a5c1a" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="10%">TRUTH ALONE TRIUMPHS</textPath>
  </text>

  <!-- Curved text at top: GOVERNMENT OF TAMILNADU -->
  <path id="topArc" d="M 18,95 A 82,82 0 0,1 182,95" fill="none"/>
  <text font-size="9" font-family="Arial, sans-serif" font-weight="bold" fill="#1a5c1a" letter-spacing="0.8">
    <textPath href="#topArc" startOffset="8%">GOVERNMENT OF TAMILNADU</textPath>
  </text>

  <!-- Palm trees on sides (simplified) -->
  <line x1="50" y1="155" x2="50" y2="125" stroke="#2d6e1a" stroke-width="2.5"/>
  <ellipse cx="50" cy="123" rx="10" ry="7" fill="#2d8e1a" opacity="0.8"/>
  <line x1="150" y1="155" x2="150" y2="125" stroke="#2d6e1a" stroke-width="2.5"/>
  <ellipse cx="150" cy="123" rx="10" ry="7" fill="#2d8e1a" opacity="0.8"/>
</svg>
